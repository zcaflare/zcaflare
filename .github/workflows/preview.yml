name: Deploy Preview (development)

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-zcaflare-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: Preview
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dopplerhq/cli-action@v3

      - name: Assert preview Doppler environment
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_PREVIEW_TOKEN }}
        run: |
          test -n "$DOPPLER_TOKEN" || { echo "::error::Missing DOPPLER_PREVIEW_TOKEN"; exit 1; }
          resolved_env="$(doppler secrets get DOPPLER_ENVIRONMENT --plain | tr '[:upper:]' '[:lower:]' | xargs)"
          case "$resolved_env" in
            dev|development|preview|stg|staging) ;;
            *) echo "::error::DOPPLER_PREVIEW_TOKEN resolved to '$resolved_env'; expected dev, development, preview, stg, or staging"; exit 1 ;;
          esac

      - name: Validate bindings · build · migrate · sync secrets · deploy
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_PREVIEW_TOKEN }}
        run: |
          test -n "$DOPPLER_TOKEN" || { echo "::error::Missing DOPPLER_PREVIEW_TOKEN"; exit 1; }
          node .github/scripts/cloudflare-preview.mjs deploy .github/deploy.preview.json
