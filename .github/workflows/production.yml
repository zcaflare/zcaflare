name: Deploy (Cloudflare Workers)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: Production
      url: https://zcaflare.thecodeorigin.com
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dopplerhq/cli-action@v3

      - name: Assert production Doppler environment
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          test -n "$DOPPLER_TOKEN" || { echo "::error::Missing DOPPLER_TOKEN"; exit 1; }
          resolved_env="$(doppler secrets get DOPPLER_ENVIRONMENT --plain | tr '[:upper:]' '[:lower:]' | xargs)"
          case "$resolved_env" in
            prd|prod) ;;
            *) echo "::error::DOPPLER_TOKEN resolved to '$resolved_env'; expected prd or prod"; exit 1 ;;
          esac

      - name: Build (Nuxt → cloudflare-module)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler run -- sh -eu -c '
            unset DOPPLER_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_TOKEN CLOUDFLARE_ACCOUNT_ID
            pnpm build
          '

      - name: Apply D1 migrations (remote)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          CF_TOKEN="$(doppler secrets get CLOUDFLARE_API_TOKEN --plain)"
          CF_ACCOUNT="$(doppler secrets get CLOUDFLARE_ACCOUNT_ID --plain)"
          test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT"
          echo "::add-mask::$CF_TOKEN"
          echo "::add-mask::$CF_ACCOUNT"
          CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT" \
            pnpm exec wrangler d1 migrations apply DB --remote --config .output/server/wrangler.json

      - name: Deploy Worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          CF_TOKEN="$(doppler secrets get CLOUDFLARE_API_TOKEN --plain)"
          CF_ACCOUNT="$(doppler secrets get CLOUDFLARE_ACCOUNT_ID --plain)"
          test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT"
          echo "::add-mask::$CF_TOKEN"
          echo "::add-mask::$CF_ACCOUNT"
          CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT" \
            pnpm exec wrangler deploy --config .output/server/wrangler.json --name zcaflare

      - name: Upsert allowlisted Worker runtime secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          umask 077
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          doppler secrets download --no-file --format json \
            | jq 'with_entries(select(.key | test("^(NUXT_|CRON_SECRET$)")))' > "$secrets_file"
          count="$(jq 'length' "$secrets_file")"
          test "$count" -gt 0 || { echo "::error::No allowlisted runtime secrets returned"; exit 1; }
          CF_TOKEN="$(doppler secrets get CLOUDFLARE_API_TOKEN --plain)"
          CF_ACCOUNT="$(doppler secrets get CLOUDFLARE_ACCOUNT_ID --plain)"
          test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT"
          echo "::add-mask::$CF_TOKEN"
          echo "::add-mask::$CF_ACCOUNT"
          CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT" \
            pnpm exec wrangler secret bulk "$secrets_file" --name zcaflare

      - name: Release (semantic-release)
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: '@semantic-release/exec'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
